<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zakmolanitech Solutions{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', 'Segoe UI',Arial,sans-serif}
        body{ background: linear-gradient(-45deg, #6a11cb, #2575fc, #00c6ff, #8e2de2); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color:#fff; min-height:100vh; }
        @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .topbar{ position:fixed; top:0; left:0; width:100%; background:rgba(20,20,20,0.95); backdrop-filter: blur(10px); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; z-index:1001; border-bottom:1px solid rgba(0,198,255,0.3) }
        .logo-wrap{ display:flex; align-items:center; gap:12px; }
        .logo-img{ width:50px; height:50px; object-fit:contain; border-radius:12px; border:2px solid #00c6ff; box-shadow:0 0 15px rgba(0,198,255,0.5) }
        .logo-text{ font-size:1.5rem; font-weight:900; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 10px rgba(0,198,255,0.9), 0 0 20px rgba(0,198,255,0.6); }
        .menu-toggle{ background:#00c6ff; color:#222; border:none; padding:10px 14px; border-radius:8px; font-size:22px; cursor:pointer; transition:0.3s }
        .menu-toggle:hover{transform:scale(1.1)}

        .sidebar{ width:280px; background:rgba(20,20,20,0.98); color:white; position:fixed; height:calc(100vh - 70px); left:0; top:70px; padding:25px 20px; z-index:1000; transition: transform 0.3s ease; transform: translateX(-100%); backdrop-filter: blur(10px) }
        .sidebar.active{ transform: translateX(0); }
        nav{display:flex; flex-direction:column; gap:8px}
        nav a{ color:white; text-decoration:none; font-weight:bold; padding:14px 18px; border-radius:10px; display:flex; align-items:center; gap:12px; transition:0.3s }
        nav a:hover{background:rgba(0,198,255,0.2); color:#00c6ff; transform:translateX(5px)}
        .donate-btn{background:linear-gradient(90deg,#ff0000,#cc0000); color:white; margin-top:15px; justify-content:center}

        .main-content{ padding:100px 20px 20px 20px; }
        .container{max-width:1100px;margin:0 auto;padding:20px}

        .page-nav{ display:flex; justify-content:space-between; max-width:600px; margin:40px auto 0 auto; gap:15px }
        .page-nav a{ flex:1; background:rgba(255,255,255,0.15); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,0.2); color:white; padding:14px 20px; border-radius:50px; text-decoration:none; font-weight:bold; text-align:center; transition:0.3s }
        .page-nav a:hover{ background:rgba(0,198,255,0.3); transform:translateY(-3px) }
        .page-nav .next{background: linear-gradient(90deg, #00c6ff, #6a11cb);}

        footer{background:rgba(20,20,20,0.9); color:white; text-align:center; padding:30px 20px; margin-top:60px; border-radius:15px; border-top:1px solid rgba(0,198,255,0.3)}
        .fab-container{ position:fixed; bottom:25px; right:25px; z-index:999; display:flex; flex-direction:column; gap:15px; }
        .fab{ width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; text-decoration:none; box-shadow:0 5px 20px rgba(0,0,0,0.3); transition:0.3s }
        .fab:hover{transform:scale(1.1)}
        .fab-whatsapp{ background:#25D366 } .fab-donate{ background:#ff0000 }
        .overlay{ display:none; position:fixed; top:70px; left:0; width:100%; height:calc(100% - 70px); background:rgba(0,0,0,0.6); z-index:999; }
        .overlay.active{display:block}
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo-wrap">
            <img src="{{ url_for('static', filename='IMG-20260809-WA3940.jpg') }}" class="logo-img" alt="Zakmolanitech Logo">
            <div class="logo-text">ZAKMOLANITECH</div>
        </div>
        <button class="menu-toggle" id="menuToggle"><i class="fa fa-bars"></i></button>
    </div>
    <div class="overlay" id="overlay"></div>

    <header class="sidebar" id="sidebar">
        <nav>
            <a href="/"><i class="fa fa-home"></i> Home</a>
            <a href="/about"><i class="fa fa-user"></i> About Us</a>
            <a href="/services"><i class="fa fa-cogs"></i> Services</a>
            <a href="/portfolio"><i class="fa fa-briefcase"></i> Portfolio</a>
            <a href="/contact"><i class="fa fa-envelope"></i> Contact</a>
            <a href="https://paypal.me/zakmolanitech" target="_blank" class="donate-btn"><i class="fa fa-heart"></i> Donate Now ❤️</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
        <footer>
            <p>made with 💕 by ZakMolan CEO Zakmolanitech solutions<br>© 2026 Zakmolanitech.com All Rights Reserved.</p>
            <div class="fab-container">
                <a href="https://paypal.me/zakmolanitech" target="_blank" class="fab fab-donate"><i class="fa fa-heart"></i></a>
                <a href="https://wa.me/256742956448" target="_blank" class="fab fab-whatsapp"><i class="fa fa-whatsapp"></i></a>
            </div>
        </footer>
    </main>
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        menuToggle.addEventListener('click', () => { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
    </script>
</body>
</html>
