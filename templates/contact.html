{% block content %}
<style>
.contact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:30px; margin-top:40px}
.contact-card{background:rgba(255,255,255,0.15); padding:30px; border-radius:20px; border:1px solid rgba(255,255,255,0.2); color:white}
.contact-card a{color:#00c6ff; text-decoration:none; font-weight:bold}
.contact-form{background:rgba(255,255,255,0.1); padding:30px; border-radius:20px; margin-top:40px; border:1px solid rgba(255,255,255,0.2)}
.contact-form input, .contact-form textarea{width:100%; padding:12px; margin:10px 0; border-radius:10px; border:none; background:rgba(255,255,255,0.9); color:#000; font-size:1rem}
.contact-form button{background:#00c6ff; color:#000; padding:14px 30px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:1.1rem}
</style>

<div class="container" style="padding:80px 20px; color:white">
    <h1 style="font-size:3rem; text-align:center; margin-bottom:10px">Get In Touch</h1>
    
    <div class="contact-grid"> ...your existing 5 cards... </div>

    <div class="contact-form">
        <h2 style="text-align:center; margin-bottom:20px">Send Us a Message</h2>
        <form id="contactForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
        <p id="status" style="text-align:center; color:#00ff88; margin-top:15px"></p>
    </div>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const data = Object.fromEntries(new FormData(this));
    const res = await fetch('/send-contact', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    document.getElementById('status').innerText = res.ok ? "Sent! We'll reply soon." : "Error. Try again.";
    if(res.ok) this.reset();
});
</script>

{% endblock %}
